services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: reelcanon
      POSTGRES_PASSWORD: reelcanon
      POSTGRES_DB: reelcanon
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - reelcanon-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reelcanon -d reelcanon"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  reelcanon-postgres:
