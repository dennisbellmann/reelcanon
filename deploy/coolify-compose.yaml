services:
  app:
    image: reelcanon:coolify
    build:
      context: /data/coolify/source/reelcanon
      dockerfile: Dockerfile
      args:
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/}
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      API_ADDR: ":8080"
      API_DATABASE_URL: postgres://reelcanon_api:${API_DATABASE_PASSWORD:?Set API_DATABASE_PASSWORD in Coolify}@database:5432/reelcanon?sslmode=disable
      FRONTEND_DIST: /app/frontend
      APP_BASE_PATH: ${APP_BASE_PATH:-/}
      AUTH_ENABLED: "false"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - app-data
      - coolify

  migrate:
    image: reelcanon:coolify
    profiles:
      - maintenance
    entrypoint: ["/app/reelcanon-migrate"]
    command: ["-dir", "/app/database/migrations"]
    restart: "no"
    environment:
      DATABASE_URL: postgres://reelcanon:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Coolify}@database:5432/reelcanon?sslmode=disable
    depends_on:
      database:
        condition: service_healthy
    networks:
      - app-data

  import-canon:
    image: reelcanon:coolify
    profiles:
      - maintenance
    entrypoint: ["/app/reelcanon-import"]
    command: ["-file", "/app/data/imdb-top-250-2025-08-20.json"]
    restart: "no"
    environment:
      DATABASE_URL: postgres://reelcanon:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Coolify}@database:5432/reelcanon?sslmode=disable
    depends_on:
      database:
        condition: service_healthy
    networks:
      - app-data

  database:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: reelcanon
      POSTGRES_USER: reelcanon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Coolify}
      API_DATABASE_PASSWORD: ${API_DATABASE_PASSWORD:?Set API_DATABASE_PASSWORD in Coolify}
    volumes:
      - reelcanon-postgres:/var/lib/postgresql/data
      - /data/coolify/source/reelcanon/deploy/init-api-role.sh:/docker-entrypoint-initdb.d/10-api-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reelcanon -d reelcanon"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-data

volumes:
  reelcanon-postgres:

networks:
  coolify:
    external: true
    name: coolify
  app-data:
    internal: true
