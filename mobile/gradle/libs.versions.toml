[versions]
kotlin = "2.4.20"
agp = "9.4.1"
compose = "1.12.1"
ksp = "2.3.12"
room = "2.8.4"
sqlite = "2.6.2"
ktor = "3.6.0"
coil = "3.6.3"
coroutines = "1.10.2"
serialization = "1.9.0"
activity = "1.12.4"

[libraries]
credentials = { module = "androidx.credentials:credentials", version = "1.6.0" }
credentials-play = { module = "androidx.credentials:credentials-play-services-auth", version = "1.6.0" }
googleid = { module = "com.google.android.libraries.identity.googleid:googleid", version = "1.2.0" }
coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
serialization = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
sqlite = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }
ktor-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-content = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coil" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
android-test-runner = { module = "androidx.test:runner", version = "1.7.0" }
android-test-junit = { module = "androidx.test.ext:junit", version = "1.3.0" }
compose-test = { module = "androidx.compose.ui:ui-test-junit4", version = "1.12.1" }
compose-test-manifest = { module = "androidx.compose.ui:ui-test-manifest", version = "1.12.1" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose = { id = "org.jetbrains.compose", version.ref = "compose" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-multiplatform = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
