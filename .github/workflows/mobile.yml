name: Mobile Android

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x mobile/gradlew
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - run: make mobile-check
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: make android-device-test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-verification
          path: |
            mobile/androidApp/build/outputs/apk/debug/*.apk
            mobile/androidApp/build/reports/
            mobile/composeApp/build/reports/tests/
